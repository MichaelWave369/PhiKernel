[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phikernel"
version = "0.1.0"
description = "Sovereign substrate for TIEKAT-aligned local runtimes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=41.0.0",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
phik = "phikernel.shell:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
